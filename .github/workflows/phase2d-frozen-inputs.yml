name: Phase 2D frozen-input diagnostic (PARTIAL science)
on:
  pull_request:
    branches: [codex/phase2c-stable-fault-metrics]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase2d-frozen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  seal:
    runs-on: windows-latest
    outputs:
      contract_sha256: ${{ steps.contract.outputs.sha256 }}
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' numpy==2.4.6 scipy==1.17.1 matplotlib==3.11.2 pytest==9.2.0
      - run: python scripts/phase2d_frozen.py prepare --output results/ci/phase2d-sealed-v1
      - id: contract
        shell: pwsh
        run: |
          $digest = (Get-FileHash results/ci/phase2d-sealed-v1/contract.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$digest" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: phase2d-shared-sealed-inputs
          path: results/ci/phase2d-sealed-v1/
          if-no-files-found: error
          retention-days: 30
  numerical:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-reference, os: windows-latest, numpy: '2.4.6', scipy: '1.17.1'}
          - {name: linux-reference, os: ubuntu-latest, numpy: '2.4.6', scipy: '1.17.1'}
          - {name: linux-numpy-sensitivity, os: ubuntu-latest, numpy: '2.3.5', scipy: '1.17.1'}
          - {name: linux-scipy-sensitivity, os: ubuntu-latest, numpy: '2.4.6', scipy: '1.16.3'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' numpy==${{ matrix.numpy }} scipy==${{ matrix.scipy }} matplotlib==3.11.2 pytest==9.2.0
      - uses: actions/download-artifact@v4
        with:
          name: phase2d-shared-sealed-inputs
          path: results/ci/phase2d-shared-inputs
      - run: python -m pytest -q
      - run: python -m compileall -q src scripts tests
      - name: Frozen diagnostic and captured log
        shell: pwsh
        run: |
          python scripts/phase2d_frozen.py run --fixture results/ci/phase2d-shared-inputs/fixture --contract results/ci/phase2d-shared-inputs/contract.json --contract-sha256 ${{ needs.seal.outputs.contract_sha256 }} --output results/ci/phase2d-frozen-worker --cohort ${{ matrix.name }} 2>&1 | Tee-Object -FilePath results/ci/phase2d-worker.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2d-frozen-${{ matrix.name }}
          path: results/ci/phase2d-frozen-worker/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2d-log-${{ matrix.name }}
          path: results/ci/phase2d-worker.log
          if-no-files-found: error
          retention-days: 30
  comparison:
    needs: numerical
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' numpy==2.4.6 scipy==1.17.1
      - uses: actions/download-artifact@v4
        with:
          pattern: phase2d-frozen-*
          path: results/ci/phase2d-frozen-artifacts
      - run: python scripts/phase2d_frozen.py compare --reference results/ci/phase2d-frozen-artifacts/phase2d-frozen-windows-reference --current results/ci/phase2d-frozen-artifacts/phase2d-frozen-linux-reference --output results/ci/frozen-comparisons/linux.json
        if: always()
      - run: python scripts/phase2d_frozen.py compare --reference results/ci/phase2d-frozen-artifacts/phase2d-frozen-windows-reference --current results/ci/phase2d-frozen-artifacts/phase2d-frozen-linux-numpy-sensitivity --output results/ci/frozen-comparisons/numpy.json
        if: always()
      - run: python scripts/phase2d_frozen.py compare --reference results/ci/phase2d-frozen-artifacts/phase2d-frozen-windows-reference --current results/ci/phase2d-frozen-artifacts/phase2d-frozen-linux-scipy-sensitivity --output results/ci/frozen-comparisons/scipy.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2d-frozen-comparisons
          path: results/ci/frozen-comparisons/
          if-no-files-found: error
          retention-days: 30
