name: scientific-validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m stellarator_robust.cli validate
      - run: python -m stellarator_robust.cli run --config configs/quick.json --output results/ci
      - run: python scripts/check_outputs.py results/ci
      - run: python scripts/audit_quick.py results/ci
