[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellarator-robust"
version = "0.1.0"
description = "Independent synthetic planar coil research benchmark"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "threadpoolctl>=3,<4", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
