<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320" role="img" aria-labelledby="title desc">
  <title id="title">Research workflow for planar-coil magnetic-field models</title>
  <desc id="desc">Six horizontal stages: 1 Formulate, 2 Build Response, 3 Optimize, 4 Quantify Uncertainty, 5 Numerical Evaluation, 6 Validate and Report.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1930"/><stop offset="1" stop-color="#17334a"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#83a9bd" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1440" height="320" rx="20" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="36" y="41" fill="#69dfd2" font-size="12" font-weight="700" letter-spacing="2">PLANAR-COIL MAGNETIC-FIELD RESEARCH</text>
    <text x="36" y="76" fill="#f1f6fb" font-size="25" font-weight="600">From synthetic assumptions to independent evidence</text>
    <g fill="none" stroke="#83a9bd" stroke-width="2" marker-end="url(#arrow)">
      <path d="M246 180h22"/><path d="M482 180h22"/><path d="M718 180h22"/><path d="M954 180h22"/><path d="M1190 180h22"/>
    </g>
    <g fill="#18354b" stroke="#416479"><rect x="30" y="107" width="212" height="148" rx="12"/><rect x="266" y="107" width="212" height="148" rx="12"/><rect x="502" y="107" width="212" height="148" rx="12"/><rect x="738" y="107" width="212" height="148" rx="12"/><rect x="974" y="107" width="212" height="148" rx="12"/><rect x="1210" y="107" width="200" height="148" rx="12"/></g>
    <g fill="#69dfd2" font-size="27" font-weight="700"><text x="47" y="145">01</text><text x="283" y="145">02</text><text x="519" y="145">03</text><text x="755" y="145">04</text><text x="991" y="145">05</text><text x="1227" y="145">06</text></g>
    <g fill="#ffffff" font-size="19" font-weight="600">
      <text x="47" y="178">Formulate</text><text x="283" y="178">Build Response</text><text x="519" y="178">Optimize</text>
      <text x="755" y="178">Quantify</text><text x="755" y="201">Uncertainty</text>
      <text x="991" y="178">Numerical</text><text x="991" y="201">Evaluation</text>
      <text x="1227" y="178">Validate</text><text x="1227" y="201">and Report</text>
    </g>
    <g fill="#bfd1df" font-size="12"><text x="47" y="229">Geometry · objectives · units</text><text x="283" y="229">Biot–Savart · normal field</text><text x="519" y="229">Ridge · sparse · minimax</text><text x="755" y="229">Paired scenarios · holdout</text><text x="991" y="229">Refinement · reproducibility</text><text x="1227" y="229">Independent checks · limits</text></g>
    <text x="36" y="291" fill="#bfd1df" font-size="13">INDEPENDENT SYNTHETIC DEMONSTRATION</text><text x="1404" y="291" text-anchor="end" fill="#bfd1df" font-size="13">Evidence and limitations accompany every claim</text>
  </g>
</svg>
